<script id="md" type="text/markdown"># 10. План исправлений и открытые вопросы

Основа: часть 09 (сравнение с `erp-yarst`). Здесь для каждой проблемы указано, что менять в коде вашей системы, как это сделать в рамках правил репозитория, чем рискуем, и что нужно решить заранее. Код не менялся, это план.

## 1. Правила репозитория, которым подчиняются все исправления

Из `CLAUDE.md` и `docs/00_rules/`:

- Бизнес-логика только в `app/Service/<Модуль>/`, контроллер вызывает сервис, валидация только через Form Request.
- Логика не живёт в базе: триггеры, функции и представления с бизнес-логикой запрещены. В базе допустимы только ограничения целостности, индексы, значения по умолчанию.
- Новая колонка обосновывается до миграции: зачем, кто пишет, кто читает, что у старых строк, почему не влезло в существующее. Деструктивные миграции только с явным «да» и дампом.
- Vue только на Options API, страницы подключаются лениво, выпадающие списки через `UniversalSelector`.
- Тесты: только `DatabaseTransactions`, один тест-файл на сервис, комплексные сценарии вместо россыпи.
- Документация пишется только после приёмки задачи и переписыванием, не дописками.
- Ветки: от `dev`, имя по ключу задачи, слияние только по явной команде.

Следствие: наши требования `VER-xx`, `DOC-xx`, `APR-xx` превращаются в задачи по этим правилам, а не в отдельный проект.

## 3. План по проблемам из части 09

### P-13…P-15. Заказы, даты и уведомления (P0)

- **P-13.** Подтвердить у разработчиков, что `applyVersion` переключает все связанные заказы. Если да, ограничить его списком заказов заявки и ввести обязательное решение ПДО по каждому заказу и заданию. Место правки: `ChangeRequestService::applyToOrder` и `SpecificationsService::syncOrderWrapperToVersion`, в сервисном слое (по правилам репозитория), с миграцией таблицы решений ПДО (обоснование колонок до миграции).
- **P-14.** Добавить в `NotificationService` метод уведомления ПДО и мастеров о затронутых заказах (по образцу `notifyChangeRequestStageReached`), вызывать при создании пакета и при проведении.
- **P-15.** Ввести в связи заявки и заказа (`change_request_production_orders`) поля решения, даты и указания (с обоснованием колонок), заполнять при проведении.
- **Риск:** изменение переключения заказов затрагивает производство. Делать только в отдельной ветке с тестом «заказ не переключается без решения ПДО».

Приоритет: P0 нужно сделать до внедрения новых функций, P1 сделать на этапе 1, P2 на этапах 2–3.

### P-01. Документация расходится с кодом по повторному согласованию (P0)

- **Проверить:** был ли механизм `re_approval` сознательно снят. Это вопрос разработчикам, не код.
- **Если снят:** переписать документ `12_каскад_и_повторное_согласование.md`, убрать описание `re_approval`, `openReApproval`, `cascadeApplySelectedAffected`, удалить устаревшую ссылку `@see` в `ChangeRequestImpactService`. Оставить описание автопоиска пострадавших и выбора.
- **Если нужен:** добавить в `ChangeRequestService` метод повторного согласования и тест (по правилу «один тест-файл на сервис»).
- **Риск:** низкий, но влияет на обучение людей. Документацию править только после приёмки (правило репозитория).

### P-02. Две политики версий родителей (P0)

- **Решение V-01 принято: вариант В (D-05).** Привести таб «Версии», импорт состава и модуль «Изменения» к одной политике.
- Вариант В: в `ChangeRequestImpactService` ввести решения по каждому родителю (`не затрагивается` с обоснованием, `пересмотреть`, `новая версия`), в `AssemblyVersionService` оставить автоматическое обновление ссылок как предложение, а не действие.
- **Миграция:** новая таблица `change_request_impact_decisions` (запись по заявке и родителю, решение, обоснование, автор, дата) вместо флага `is_selected`. Обоснование колонок описать до миграции.
- **Тесты:** сценарий «деталь в трёх изделиях, по одному решению на каждое».

### P-03. Хардкод адресов в коде (P1)

- Вынести `ASSIGNEE_EMAIL_BY_TYPE` и адрес в шаге «Проверить технологию» в настройки модуля (по образцу `module_settings` и `ShopFloorAssigneeService`).
- В настройках: тип файла → роль или пользователь, запасной вариант «первый администратор» оставить.
- **Риск:** при пустой настройке задача не создаётся. Нужна проверка на форме настроек.

### P-04. Хардкод статус-кодов мимо движка процессов (P1)

- Собрать пять мест (`TechMapTaskGeneratorService`, `SpecDrawingAnalysisService`, `TaskRelationService`, `TaskService`, `CrmLeadService`) в один справочник в сервисе статусов, где каждая точка берёт коды по роли («этап проверки НСИ», «этап технологии»).
- Делается до любого редизайна статусов (док. 21), иначе правки умножатся.

### P-05. Дубли процессов КОМПАС и SolidWorks (P2)

- Решение разработчиков: объединить в один процесс с условием по интеграции или оставить клоны со скриптом синхронизации. До решения V-01 не трогать.

### P-06. Нет блокировки при редактировании (P1)

- **Что добавить:** таблицу блокировок (`document_locks`: объект, владелец, время взятия, срок, причина) и номер ревизии записи (`row_version`) для оптимистичной блокировки.
- **Где применить:** сначала для файлов (чертёж, 3D, DXF) и для технологии, затем для состава.
- **Как:** сервис `Pdm/EditLockService` с методами «взять», «вернуть», «снять чужую» (только администратор), защита в мутирующих методах рядом с `TechMapEditPolicy`. Логика в коде, а не в базе.
- **Фронт:** значок блокировки в дереве, баннер «редактирует Иванов, с 10:42», кнопка «взять в работу».
- **Риск:** блокировка без тайм-аута застрянет, поэтому автоснятие настраивать сразу.

### P-07. Нет типов документов (P0 для вашей задачи)

- **Что добавить:** справочник `document_types` (группа, применимость, обязательность, форматы, значок) и таблицы `product_documents`, `product_document_versions`, связанные с `Product` и версиями файлов.
- **Что не ломать:** три существующих слота `drawing_id`, `laser_cutting_template_id`, `model_3d_id` остаются как «основные», новые типы добавляются рядом.
- **Миграция:** расширять, затем переливать, затем сужать отдельными релизами (правило репозитория).
- **Значки:** брать из справочника, формат описан в части 08. В репозитории `NodeTypeIcon` и `ProductIcon` дополнить, не заменять.

### P-08. Подписи и информационно-удостоверяющий лист (отложено, D-07)

- Подписей пока нет и на первом этапе не будет. Заложить только место: в согласовании фиксировать «кто, когда, какое решение» в журнале, чтобы позже добавить подпись без переделки.
- Если понадобится позже: таблица `signatures`, подпись версии с контрольной суммой файла, роль «характер работы» в стадии согласования.

### P-09. Состав на дату, литера, номера экземпляров (P1)

- **Состав на дату:** сервис на основе `change_logs` и периодов архивных версий, без новых колонок. Если данных не хватает, добавить период в версию узла (`valid_from`, `valid_to`) с обоснованием колонок.
- **Литера:** поле версии, ввод по извещению.
- **Номера экземпляров:** связь с производственными заказами через заказ-обёртку, уже есть `ProductionOrder`.

### P-10. Путаница понятий «применяемость» (P2)

- В интерфейсе и в документах различать «Где используется» (то, что у вас называется применяемостью) и «Условия применения версии» (период, литера, номер). Переименовать вкладку при внедрении периода.

### P-11. Интеграция с КОМПАС через Excel (P2)

- Оставить как есть, добавить второй канал: чтение свойств модели и основной надписи через API КОМПАС (таблица правил преобразования, как в методологии). Сроки зависят от доступа к лицензиям.

### P-12. Типы заявок и бланки (P2, после V-05)

- Привести названия типов к таблице соответствия (`regular` → ИИ, `preliminary` → ПИ, `planned` → плановое ИИ), добавить бланк ИИ (шаблон DOCX, формирование через существующий механизм экспорта).

## 4. Что можно переиспользовать из нашего проекта

Это разработки проекта `Checking`, которые могут встать в вашу систему как отдельный сервис или библиотека.

| Что | Как использовать |
|---|---|
| Движок правил проверки чертежей (`checking/engine.py`) | Вызывается как сервис, возвращает замечания с кодом, уровнем и текстом. Подходит как «нормоконтроль» перед согласованием заявки. Нужен интерфейс (REST или очередь заданий) |
| Коды и тексты замечаний | Остаются неизменными (обратная совместимость), заносятся в справочник на стороне ERP для отображения |
| Сверка с Excel и комплектность | Уже совпадает с вашими проверками НСИ и технологий. Использовать как второй источник |
| Пиктограммы (часть 08) | Дополняют `ProductIcon` и `NodeTypeIcon`, хранятся как SVG, значки берутся из справочника типов |
| Схема процесса изменений (часть 04) | Основа для обновления документации модуля «Изменения» |

Условие: сначала решение V-06 и описание интерфейса вызова.

## 5. Порядок работ

1. **Подготовка (1–2 недели).** Ответы на V-01…V-08, решение по P-01, настройка документации, ветки по правилам репозитория.
2. **Этап A. Политика версий и данные (P-02, P-09, P-04).** Одна политика, решения по родителям, состав на дату, единый справочник статус-кодов.

5. **Этап D. Интеграции (P-11, нормоконтроль через наш движок).**

Оценки по трудоёмкости не даны: для них нужны оценка разработчиков и реальный объём данных.

## 6. Что нужно от разработчиков заказчика

1. Подтвердить или опровергнуть вывод P-01.
2. Объяснить, почему родители узла обновляются автоматически, и принято ли это решение сознательно.
3. Подтвердить, что в системе нет блокировки при редактировании и нет типов документов, кроме чертежа, DXF и 3D.
4. Описать, как работает загрузка 3D с сервера, чем конвертируется и в какой формат.
5. Показать, где хранятся файлы и есть ли у них хеш и защита от перезаписи.
6. Уточнить права доступа: какие роли и какие операции можно ограничивать по состоянию версии.

function checkMissing(root){
  var bad=[];
  root.querySelectorAll('.tile[data-i]').forEach(function(t){
    var n=t.getAttribute('data-i');
    if(n.indexOf('svg:')===0)return;
    var i=t.querySelector('i');
    var c=getComputedStyle(i,'::before').content;
    if(!c||c==='none'||c==='normal'){t.classList.add('missing');bad.push(n)}
  });
  if(bad.length)document.getElementById('warn').textContent='Не найдены в шрифте: '+bad.join(', ');
}
