<script id="md" type="text/markdown"># 09. Сравнение с текущей реализацией

Объект сравнения: репозиторий `erp-yarst` (Laravel 11, Vue 3, PostgreSQL), модули «PDM» (спецификации, дерево, версии), «Изменения» (заявки на изменение), классификатор, файлы. Сравниваем с частями 01–08 этого ТЗ и с методологией СТ3D.

## 1. Как проводилось сравнение и что не проверено

| Что сделано | Что не сделано |
|---|---|
| Прочитана проектная документация модулей PDM (22 файла) и «Изменения» (22 файла), `CLAUDE.md`, `pdm.md`, `applicability_system.md` | Приложение не запускалось, база данных не просматривалась, тесты не гонялись |
| Ключевые утверждения документации проверены в коде по наличию классов, методов, миграций и тестов (список в разделе 7) | Код читался выборочно: построчной сверки всего `SpecificationsService` (более 17 тыс. строк) не было |
| Одно расхождение документации с кодом найдено и подтверждено чтением кода (раздел 5, P-01) | Права доступа, роли, поиск, уведомления, интеграции с 1С изучены по документации, не по коду |

Поэтому в таблицах ниже каждое утверждение имеет метку источника: «код» (подтверждено наличием в коде), «док.» (по документации, в коде не сверено) или «не найдено» (поиск по документации и репозиторию ничего не дал). «Не найдено» не доказывает отсутствие, это повод уточнить у разработчиков.

## 2. Соответствие терминов

| В нашем ТЗ | В вашей системе | Примечание |
|---|---|---|
| Компонент (сборочная единица, деталь) | `Product` (карточка номенклатуры в классификаторе) плюс `TechMap` типа `assembly` для сборки | Деталь это `Product` без своей `TechMap`, сборка это `Product` плюс `TechMap`. Единой сущности «компонент» нет |
| Версия компонента | `TechMap` в группе `TechMapGroup` (`tech_map_group_id`, `version`, `source_id`, `is_current`) | Версия принадлежит узлу, не дереву изделия (код, миграция 2026-08-23) |
| Состав | `TechMapComponent` (`parent_tech_map_id`, `tech_map_id`, `product_id`, `count`, `total_count`) | Связь «сборка → дочерняя сборка» ведёт на конкретную версию узла (`tech_map_id`) |
| Документ | Файл, привязанный к `Product`: чертёж (`drawing_id`), DXF (`laser_cutting_template_id`), 3D (`model_3d_id`) | Других типов документов нет (док.) |
| Состояние | `TechMapStatus.code` (код) | Набор отличается от методологии, см. раздел 4.2 |
| ИИ | `ChangeRequest` | Типы: `regular`, `preliminary`, `planned`, плюс замена чертежа, пересмотр норм, проверка маршрута |
| Применяемость | `ApplicabilityService`, группы версий и заказы-обёртки | Период действия есть на архивных версиях, литеры и номеров экземпляров нет (док.) |
| Где используется | `NodeUsage`, `ApplicabilityService` | Есть (код) |
| Версия состава на дату | не найдено | Есть «текущая версия» (`is_current`) и период архива, но запроса «состав по дате» нет |

## 3. Решения вашей системы, которые стоит сохранить

Эти решения выглядят сильнее или точнее методологии, и ТЗ нужно подстроить под них, а не наоборот.

| № | Решение | Источник | Почему стоит сохранить |
|---|---|---|---|
| S-01 | Хеш состава узла (`composition_hash`), переиспользование одинаковых узлов между версиями и изделиями | код (миграция, `AssemblyVersionService::findReusableAssembly`) | Исключает дубли сборок, делает сравнение версий дешёвым |
| S-02 | Правка общего узла через защиту (`guardNodeEdit`): режимы «сквозь все» или «новая версия узла», where-used показывается до правки | код, док. 19 | Закрывает требование «подтверждать влияние» (наш CH-20…CH-22) на уровне состава |
| S-03 | Архив неизменяем, проверка владения по цепочке (`TechMapEditPolicy::ownershipVerdict`) | код | Прямое воплощение принципа «утверждённое не правят» |
| S-04 | Обёртка заказа (wrapper-mBOM): заказ ссылается на обёртку, внутри ссылка на архив, количество единственная переменная | док. 09 | Решает «одна версия на много заказов с разным количеством», в методологии нет |
| S-05 | Единая точка сравнения версий `compareSpecificationVersions` для таба «Версии» и «Листа изменений» | код | Нет параллельных алгоритмов сравнения |
| S-06 | Импорт состава из КОМПАС и SolidEdge в три шага: анализ, окно «Обнаруженные изменения», применение; отпечаток плана, защита от устаревшего плана | код (`KompasImportFlowService`), док. 18 | Решает сценарий «обновить состав из CAD без молчаливой потери данных» лучше, чем обмен «как есть» |
| S-07 | Проверки готовности: НСИ, технологии, чертежи, сверка массы с чертежом по ИИ, сверка «чертёж / DXF / 3D» с созданием задач на замену | док. 11, 14 | Это ваш аналог комплектности и автопроверки, есть привязка к исполнителям |
| S-08 | Модуль «Изменения»: триаж, срочность, очередь и конфликты по заказам, чек-лист согласующих, участники, AI-сводка, задание для ПДО, лист «Изменения» в экспорте | код, док. | Шире, чем минимум нашего ТЗ |
| S-09 | Сценарии из цеха: замена чертежа, пересмотр нормирования, проверка маршрута, заявка из «Экрана в цеху» | док. | В методологии нет, это ваш живой процесс |
| S-10 | Версия технологии и её форк вместе с узлом, чтобы правка норм не протекала в старую версию | док. 19 | Закрывает связь «изменение детали → технология» |
| S-11 | Строгая архитектура репозитория: Controller → Service, Form Request, без бизнес-логики в базе, безопасные миграции, `DatabaseTransactions` в тестах | `CLAUDE.md` | Правила, которым должны подчиняться все исправления из части 10 |

## 4. Сравнение по частям ТЗ

Колонка «Статус»: ✔ есть, ◐ частично, ✖ нет или не найдено, ≠ сделано иначе.

### 4.1 Часть 01. Концепция и границы

| Требование ТЗ | Статус | Как сделано у вас | Отличие и вывод |
|---|---|---|---|
| Роль АС УДИ: данные хранятся в системе, прикладные системы работают через неё | ◐ | Данные в базе ERP, КОМПАС и SolidEdge подключены через импорт Excel-выгрузки (док. 18) | Обмен идёт файлом спецификации, а не чтением модели (см. 4.3) |
| Роли: разработчик, согласующий, подписчик, нормоконтролёр, архивариус, держатель копий | ◐ | Роли ERP (`Role`, `UserModulePermission`), `can_edit` и `can_delete`, назначение конструктора, технолога, главного конструктора на заявке, согласующие, участники, триажник (док.) | Нет «характера работы» при подписи, нет архивариуса и держателя копий как ролей |
| Состояния по методологии | ≠ | Плоская цепочка `draft → in_progress → composition_approved → drawings_checked → technology_added → technology_checked → nsi_checked → final_check → archived_actual → in_production → under_change`, плюс `cancelled`, `version_for_tkp` (код: `TechMapStatus`, док. 21) | Состояния отражают **стадии подготовки спецификации**, а не жизненный цикл версии. Соответствие в разделе 4.2 |
| Применяемость: номер, период, литера | ◐ | Период у архива (`archived_actual_*_date`), «применяемость» как «где используется» (док.) | Номеров экземпляров и литеры не найдено. «Где используется» называется применяемостью, в методологии это другое понятие |
| Принцип «изменение = новая версия» | ✔ | Архив неизменяем, правка идёт через новую версию (код) | Совпадает |
| Принцип «версия родителя не создаётся автоматически» (D-05) | ≠ | Родители изменившегося узла в текущем изделии **получают новую версию автоматически** (док. 07, §1) | Прямое противоречие D-05. Требует решения, см. часть 10, вопрос V-01 |

### 4.2 Состояния: наша схема против вашей

| Состояние методологии | Ближайшее у вас | Комментарий |
|---|---|---|
| Проектирование | `draft`, `in_progress` | Несколько подэтапов подготовки |
| Согласование | `composition_approved`, `drawings_checked`, `technology_added`, `technology_checked`, `nsi_checked`, `final_check` | У вас согласование разбито на шаги задач. Выпуск через заявку на изменение, а не через общий процесс |
| Утверждён | нет отдельного | Утверждение растворено в шагах. Исследование `21_редизайн_статусов_эси.md` предлагает последовательность «Черновик, Разработан, Утверждён» для конструктора и для технолога |
| Архив (действует) | `archived_actual` | Есть даты периода |
| Заменён по ИИ | `archived` | Заменён новой версией. Причина и ссылка на заявку лежат в `change_request_id` версии |
| Введено по ПИ | нет | Ближайшее `under_change` и тип заявки `preliminary` |
| Аннулирован | `cancelled` | Но он «отменена», а не «аннулирована» |

### 4.3 Часть 02. Состав, версии, справочники

| Требование ТЗ | Статус | Как сделано у вас | Отличие и вывод |
|---|---|---|---|
| STR-01…03 Состав и связи | ✔ | `TechMapComponent`, `object_relations`, иерархия, ссылки `tech_map_id` (код) | Связей «Документы», «Замена», «Исполнение» нет как типов. Есть группы замены номенклатуры (`ProductReplacement`, док.) |
| STR-02 Связи по компоненту, не по версии | ≠ | Ссылка идёт на конкретную версию узла (`tech_map_id`) | Решение вашей системы, нужно синхронизировать с D-05 |
| STR-04 «Где используется» | ✔ | `AssemblyVersionService::nodeUsage`, `ApplicabilityService`, каскад «пострадавшие спецификации» (код) | Есть и по узлу, и в модуле «Изменения» |
| STR-06 Групповые документы и исполнения | ◐ | Групповая спецификация по варианту Б в настройках КОМПАС, связь «Исполнение» не найдена | Нужна проверка у разработчиков |
| STR-07 Сверка с Excel и 1С | ✔ | Импорт и экспорт Excel, модуль 1С (док.) | Совпадает с требованием |
| NUM Нумерация | ◐ | Децимальный номер в карточке номенклатуры, номер заявки `ИЗМ-YY-NNNN`. Автонумератора обозначений ЕСКД не найдено | Для заявок есть, для изделий не найдено |
| ATT Атрибуты и справочники | ✔ | Классификатор: типы продукции и НСИ, типы заготовки, материалы, сортамент, группы связей (док.) | Сортамент и материалы сильнее нашего ТЗ (расчёт раскладки, листовой металл) |
| VER-01 Версии, неизменяемость | ✔ | Нумерация «1.0, 2.0» вручную и «1.01» автоматически для узлов | Различие с методологией: временные версии по ПИ у нас 1.1, у вас минорные 1.01 для узлов |
| VER-02…04 Взять в работу, блокировка | ✖ | Не найдено. Есть защита общего узла (409) и блокировки на уровне записи БД | Параллельной работы с блокировкой файла нет. Нужна новая подсистема |
| VER-05 Варианты в проектировании | ◐ | Несколько черновых версий в одной группе возможны | Выбора «основного» варианта перед согласованием как процедуры нет |
| VER-06 Оптимистичная блокировка | ✖ | Не найдено (поиск по `lock_version`, `locked_by` пуст) | Нужна |
| VER-08 Перебазирование извещения | ◐ | Очередь и слияние заявок по заказам (`merge-into`, `queued`) | Решает конфликты по заказам, но не перебазирует состав |
| DOC Типы документов | ✖ | Три слота файла на продукте: чертёж, DXF, 3D. Тип «РЭ», «ПС», «ведомость» не найден | Эксплуатационной документации нет |
| DOC-03 Комплектность | ◐ | Проверки НСИ, технологии, чертежей | Это комплектность данных, а не комплекта документов |
| Правила взаимосвязи | ✖ | Не найдено | Нужны |

### 4.4 Часть 03. Файлы, чертежи, 3D

| Требование ТЗ | Статус | Как сделано у вас | Отличие и вывод |
|---|---|---|---|
| Исходник плюс вторичное представление | ◐ | Чертёж хранится как файл (PDF и изображения), версии `version_number`, активная версия в `Product.drawing_id` (код) | Явного понятия «вторичное представление» нет |
| 3D-модели | ◐ | Слот `model_3d_id` с 2026-06-27 (код, миграция), просмотрщик `Model3dViewer` (.glb, .gltf), просмотр DXF (док. 14) | Это совпадает с нашим вариантом Б. Расхождение с вашим описанием «пока только PDF»: в коде 3D уже предусмотрено |
| Просмотр PDF и 3D в браузере | ✔ | `PdfPreviewFrame`, `DxfViewer`, `Model3dViewer` | Есть |
| Привязка файла к версии | ≠ | Чертёж «активный» на продукте. Новая версия узла получает «свободный чертёж карточки» (`AssemblyDrawingService::attachFreeCardDrawings`) | Файл привязан к номенклатуре, а не к версии узла, версия «подхватывает» его правилами |
| Хеш и неизменяемость файла | не найдено | — | Нужно проверить хранилище файлов (`modules/files`) |
| Интеграция с КОМПАС: чтение модели | ≠ | Импорт **Excel-выгрузки спецификации** КОМПАС и SolidEdge, а не чтение модели и основной надписи | Отличие от FIL-08 и от методологии. Плюс: простота, минус: теряются свойства модели |
| Сверка чертёж, DXF, 3D | ✔ | `SpecificationFileReviewService` (код в списке) | Превосходит наше требование |
| Автопроверка чертежа по ГОСТ | ◐ | ИИ-анализ чертежа (`drawings_info`, модель Qwen3-VL): масса, обозначение (док.) | Наш движок правил решает ту же задачу детерминированно, см. часть 10, интеграция |

### 4.5 Часть 04. Изменения

function checkMissing(root){
  var bad=[];
  root.querySelectorAll('.tile[data-i]').forEach(function(t){
    var n=t.getAttribute('data-i');
    if(n.indexOf('svg:')===0)return;
    var i=t.querySelector('i');
    var c=getComputedStyle(i,'::before').content;
    if(!c||c==='none'||c==='normal'){t.classList.add('missing');bad.push(n)}
  });
  if(bad.length)document.getElementById('warn').textContent='Не найдены в шрифте: '+bad.join(', ');
}
var md=document.getElementById('md').textContent;
var out=document.getElementById('out');
out.innerHTML=marked.parse(md);
var h3s=out.querySelectorAll('h2,h3');
for(var k=0;k<h3s.length;k++){
  if(h3s[k].textContent.indexOf('Пиктограммы объектов')>=0){
    var g=document.createElement('div');g.className='gal';g.innerHTML=buildGallery();
    h3s[k].parentNode.insertBefore(g,h3s[k].nextSibling);break;
  }
}
out.querySelectorAll('code.language-mermaid').forEach(function(c){
  var d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.parentNode.replaceWith(d);
});
if(window.mermaid){mermaid.initialize({startOnLoad:false,theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'default'});mermaid.run({querySelector:'.mermaid'});}
function go(){document.fonts.ready.then(function(){setTimeout(function(){checkMissing(out)},400)})}
go();
